name: Sync Garmin & AI Log

on:
  schedule:
    - cron: '0 14 * * *' # 한국 시간 기준 매일 밤 11시 자동 실행
  workflow_dispatch:      # 수동 실행 버튼

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install garminconnect google-generativeai firebase-admin

      - name: Run sync script
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_EMAIL_HJ: ${{ secrets.GARMIN_EMAIL_HJ }}
          GARMIN_PASSWORD_HJ: ${{ secrets.GARMIN_PASSWORD_HJ }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python sync.py
