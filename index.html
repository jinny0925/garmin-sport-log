<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sports Log & AI Coach</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --swim: #38bdf8;
      --gold: #f59e0b;
      --active-day: #1f6feb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 650px; margin: 0 auto; line-height: 1.5; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    header h1 { font-size: 1.15rem; color: #fff; }

    /* 달력 컨트롤 및 그리드 */
    .cal-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: var(--card-bg); padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border); }
    .cal-controls button { background: none; border: 1px solid var(--border); color: #fff; padding: 4px 12px; border-radius: 6px; cursor: pointer; }
    .cal-controls span { font-weight: 700; color: #fff; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
    .cal-header { text-align: center; font-size: 0.75rem; color: var(--text-muted); padding: 4px 0; font-weight: 600; }
    
    .cal-cell { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; min-height: 64px; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: 0.2s; }
    .cal-cell:hover { border-color: var(--accent); }
    .cal-cell.empty { background: transparent; border-color: transparent; cursor: default; }
    .cal-cell.today { border-color: var(--gold); }
    .cal-date { font-size: 0.75rem; font-weight: 600; }
    
    .cal-badge { font-size: 0.65rem; background: rgba(56, 189, 248, 0.15); color: var(--swim); border-radius: 4px; padding: 2px 3px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; margin-top: 2px; }
    .badge-has-note { border-bottom: 2px solid var(--gold); }

    /* 모달 팝업 */
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; padding: 18px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 14px; }
    .modal-header h2 { font-size: 1.1rem; color: #fff; }
    .close-btn { background: none; border: none; font-size: 1.4rem; color: var(--text-muted); cursor: pointer; }

    /* 세션 및 디테일 지표 스타일 */
    .session-box { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .session-top { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.95rem; margin-bottom: 8px; color: #fff; }
    
    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
    .metric-item { background: #161b22; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 0.75rem; color: var(--text-muted); }
    .metric-item strong { display: block; font-size: 0.85rem; color: #fff; margin-top: 2px; }

    .ai-box { background: rgba(88, 166, 255, 0.08); border-left: 3px solid var(--accent); border-radius: 4px; padding: 12px; margin-top: 12px; font-size: 0.85rem; color: #e6edf3; line-height: 1.6; }
    .ai-title { font-weight: 700; color: var(--accent); margin-bottom: 6px; font-size: 0.8rem; }

    .note-box { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
    .note-box label { display: block; font-size: 0.8rem; color: var(--gold); font-weight: 700; margin-bottom: 6px; }
    .note-box textarea { width: 100%; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 10px; font-size: 0.85rem; resize: vertical; min-height: 70px; }
    .save-btn { margin-top: 8px; background: #238636; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; float: right; }
  </style>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 본인의 Firebase Console 정보로 직접 교체해주세요
    const firebaseConfig = {
      apiKey: "AIzaSyAnU1E1qhqxIzcyNaO64H_PR9r_9CrnRxQ",
      authDomain: "garmin-sport-log.firebaseapp.com",
      projectId: "garmin-sport-log",
      storageBucket: "garmin-sport-log.firebasestorage.app",
      messagingSenderId: "836183510846",
      appId: "1:836183510846:web:b18cc66f12499f287ba66f"
    };
      

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activityMap = {}; // "YYYY-MM-DD" -> Data
    let currentYear = 2026;
    let currentMonth = 8; // 9월 (0부터 시작하므로 8)

    const calGrid = document.getElementById("calendar-grid");
    const currentMonthLabel = document.getElementById("current-month-label");
    const modal = document.getElementById("detail-modal");

    // Firestore 실시간 구독
    onSnapshot(collection(db, "activities"), (snapshot) => {
      activityMap = {};
      snapshot.forEach(docSnap => {
        activityMap[docSnap.id] = docSnap.data();
      });
      renderCalendar();
    });

    function renderCalendar() {
      calGrid.innerHTML = "";
      currentMonthLabel.innerText = `${currentYear}년 ${currentMonth + 1}월`;

      const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
      const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();

      // 요일 헤더
      const days = ["일", "월", "화", "수", "목", "금", "토"];
      days.forEach(d => {
        const h = document.createElement("div");
        h.className = "cal-header";
        h.innerText = d;
        calGrid.appendChild(h);
      });

      // 공백 셀
      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "cal-cell empty";
        calGrid.appendChild(emptyCell);
      }

      // 날짜 셀 생성
      for (let d = 1; d <= lastDate; d++) {
        const cell = document.createElement("div");
        cell.className = "cal-cell";

        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const log = activityMap[dateStr];

        let badgeHtml = "";
        if (log && log.sessions && log.sessions.length > 0) {
          const dist = log.totalDistance || 0;
          const noteClass = log.userNote ? "badge-has-note" : "";
          badgeHtml = `<div class="cal-badge ${noteClass}">${dist > 0 ? dist + 'm' : '완료'}</div>`;
        }

        cell.innerHTML = `
          <div class="cal-date">${d}</div>
          ${badgeHtml}
        `;

        cell.addEventListener("click", () => openDetailModal(dateStr));
        calGrid.appendChild(cell);
      }
    }

    function openDetailModal(dateStr) {
      const log = activityMap[dateStr] || { date: dateStr, sessions: [], userNote: "", feedback1: "" };
      document.getElementById("modal-date").innerText = `${dateStr} 훈련 리포트`;

      const sessionsContainer = document.getElementById("modal-sessions");
      sessionsContainer.innerHTML = "";

      if (log.sessions.length === 0) {
        sessionsContainer.innerHTML = '<div style="color:#8b949e; text-align:center; padding:20px;">기록된 운동이 없습니다.</div>';
      } else {
        log.sessions.forEach(s => {
          const sBox = document.createElement("div");
          sBox.className = "session-box";
          
          let metrics = `
            <div class="metric-item">거리<strong>${s.distance ? s.distance.toLocaleString() + 'm' : '-'}</strong></div>
            <div class="metric-item">페이스<strong>${s.pace || '-'}</strong></div>
            <div class="metric-item">SWOLF<strong>${s.swolf || '-'}</strong></div>
          `;

          // 세부 디테일 지표가 존재할 경우 표시
          if (s.avgStrokes) metrics += `<div class="metric-item">스트로크(길이당)<strong>${s.avgStrokes}회</strong></div>`;
          if (s.poolLength) metrics += `<div class="metric-item">레인 길이<strong>${s.poolLength}m</strong></div>`;
          if (s.avgHR) metrics += `<div class="metric-item">심박수<strong>평균 ${s.avgHR} / 최대 ${s.maxHR || '-'}</strong></div>`;
          if (s.aerobicTE) metrics += `<div class="metric-item">운동 효과<strong>유산소 ${s.aerobicTE} / 무산소 ${s.anaerobicTE || 0}</strong></div>`;
          if (s.trainingLoad) metrics += `<div class="metric-item">운동 부하<strong>${s.trainingLoad}</strong></div>`;
          if (s.calories) metrics += `<div class="metric-item">칼로리<strong>${s.calories} kcal</strong></div>`;

          sBox.innerHTML = `
            <div class="session-top">
              <span>${s.icon || '🏅'} ${s.title || '운동 세션'}</span>
              <span style="font-size:0.75rem; color:#8b949e;">${s.location || ''}</span>
            </div>
            <div class="metrics-grid">${metrics}</div>
          `;
          sessionsContainer.appendChild(sBox);
        });
      }

      // AI 피드백
      const aiContainer = document.getElementById("modal-ai");
      if (log.feedback1) {
        aiContainer.style.display = "block";
        document.getElementById("modal-ai-text").innerText = log.feedback1;
      } else {
        aiContainer.style.display = "none";
      }

      // 일기/메모
      const noteInput = document.getElementById("modal-note");
      noteInput.value = log.userNote || "";

      // 저장 버튼 이벤트
      const saveBtn = document.getElementById("modal-save-btn");
      saveBtn.onclick = async () => {
        saveBtn.innerText = "저장 중...";
        try {
          const docRef = doc(db, "activities", dateStr);
          await updateDoc(docRef, { userNote: noteInput.value });
          saveBtn.innerText = "저장 완료!";
          setTimeout(() => { saveBtn.innerText = "메모 저장"; }, 1500);
        } catch (err) {
          alert("저장 실패: " + err.message);
          saveBtn.innerText = "메모 저장";
        }
      };

      modal.style.display = "flex";
    }

    // 모달 닫기
    document.getElementById("modal-close-btn").addEventListener("click", () => {
      modal.style.display = "none";
    });
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.style.display = "none";
    });

    // 월 이동 버튼
    document.getElementById("prev-month-btn").addEventListener("click", () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar();
    });
    document.getElementById("next-month-btn").addEventListener("click", () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    });
  </script>
</head>
<body>
  <header>
    <h1>🏊 Sports Log Calendar</h1>
  </header>

  <div class="cal-controls">
    <button id="prev-month-btn">&lt;</button>
    <span id="current-month-label"></span>
    <button id="next-month-btn">&gt;</button>
  </div>

  <div class="cal-grid" id="calendar-grid"></div>

  <!-- 상세 리포트 모달 -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-date"></h2>
        <button class="close-btn" id="modal-close-btn">&times;</button>
      </div>

      <div id="modal-sessions"></div>

      <div class="ai-box" id="modal-ai" style="display:none;">
        <div class="ai-title">🤖 AI 코칭 리포트</div>
        <div id="modal-ai-text"></div>
      </div>

      <div class="note-box" style="overflow: hidden;">
        <label>📝 운동 일기 & 메모</label>
        <textarea id="modal-note" placeholder="오늘 훈련 감각, 컨디션 등을 작성하세요."></textarea>
        <button class="save-btn" id="modal-save-btn">메모 저장</button>
      </div>
    </div>
  </div>
</body>
</html>
