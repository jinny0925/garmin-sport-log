<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sports Log & AI Coach</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --swim: #38bdf8;
      --dive: #2dd4bf;
      --golf: #4ade80;
      --gold: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; line-height: 1.5; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.25rem; font-weight: 700; color: #fff; }
    
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .date-badge { font-size: 0.95rem; font-weight: 700; color: #fff; }
    .total-badge { font-size: 0.8rem; background: #21262d; padding: 2px 8px; border-radius: 12px; color: var(--accent); border: 1px solid var(--border); }
    
    .session-item { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .session-title { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    .session-metrics { display: flex; gap: 12px; font-size: 0.8rem; color: var(--text-muted); }
    .session-metrics span strong { color: var(--text); font-weight: 600; }
    
    .laps-wrap { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 6px; font-size: 0.75rem; color: var(--text-muted); }
    .lap-row { display: flex; justify-content: space-between; padding: 2px 0; }
    
    .ai-box { background: rgba(88, 166, 255, 0.08); border-left: 3px solid var(--accent); border-radius: 4px; padding: 10px; margin-top: 12px; font-size: 0.85rem; color: #e6edf3; white-space: pre-wrap; }
    .ai-title { font-weight: 700; color: var(--accent); margin-bottom: 4px; font-size: 0.8rem; }
    
    .note-box { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
    .note-box label { display: block; font-size: 0.8rem; color: var(--gold); font-weight: 600; margin-bottom: 4px; }
    .note-textarea { width: 100%; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 8px; font-size: 0.85rem; resize: vertical; min-height: 50px; }
    .save-btn { margin-top: 6px; background: #238636; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; float: right; }
    .save-btn:active { background: #2ea043; }
    .clearfix::after { content: ""; clear: both; display: table; }

    #loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 0.9rem; }
  </style>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 본인의 Firebase Console 정보로 직접 교체해주세요
    const firebaseConfig = {
      apiKey: "AIzaSyAnU1E1qhqxIzcyNaO64H_PR9r_9CrnRxQ",
      authDomain: "garmin-sport-log.firebaseapp.com",
      projectId: "garmin-sport-log",
      storageBucket: "garmin-sport-log.firebasestorage.app",
      messagingSenderId: "836183510846",
      appId: "1:836183510846:web:b18cc66f12499f287ba66f"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const logContainer = document.getElementById("log-list");
    const loadingEl = document.getElementById("loading");

    // Firestore activities 컬렉션 실시간 구독
    onSnapshot(collection(db, "activities"), (snapshot) => {
      loadingEl.style.display = "none";
      logContainer.innerHTML = "";

      const logs = [];
      snapshot.forEach((docSnap) => {
        logs.push(docSnap.data());
      });

      // 날짜 최신순 정렬
      logs.sort((a, b) => (b.date || "").localeCompare(a.date || ""));

      if (logs.length === 0) {
        logContainer.innerHTML = '<div style="text-align:center; padding:40px; color:#8b949e;">아직 저장된 운동 기록이 없습니다.</div>';
        return;
      }

      logs.forEach((log) => {
        const card = document.createElement("div");
        card.className = "card";

        const sessions = log.sessions || [];
        const totalDist = log.totalDistance || sessions.reduce((acc, cur) => acc + (cur.distance || 0), 0);

        let sessionsHtml = "";
        sessions.forEach((s) => {
          let metricStr = "";
          if (s.sport === "swim") {
            metricStr = `<span>거리: <strong>${s.distance ? s.distance.toLocaleString() : 0}m</strong></span>
                         <span>페이스: <strong>${s.pace || "-"}</strong></span>
                         <span>SWOLF: <strong>${s.swolf || "-"}</strong></span>`;
          } else if (s.sport === "freediving") {
            metricStr = `<span>최대 수심: <strong>${s.maxDepth || 0}m</strong></span>
                         <span>시간: <strong>${Math.floor((s.duration || 0)/60)}분</strong></span>`;
          } else {
            metricStr = `<span>기록: <strong>${s.score || "완주"}</strong></span>`;
          }

          let lapsHtml = "";
          if (s.laps && s.laps.length > 0) {
            lapsHtml = '<div class="laps-wrap">' + s.laps.map(l => 
              `<div class="lap-row"><span>${l.lap}</span><span>${l.pace} (SWOLF ${l.swolf})</span></div>`
            ).join("") + '</div>';
          }

          sessionsHtml += `
            <div class="session-item">
              <div class="session-title">
                <span>${s.icon || "🏅"} ${s.title || "운동 세션"}</span>
                <span style="font-size:0.75rem; color:#8b949e;">${s.location || ""}</span>
              </div>
              <div class="session-metrics">${metricStr}</div>
              ${lapsHtml}
            </div>
          `;
        });

        card.innerHTML = `
          <div class="card-header">
            <span class="date-badge">${log.date}</span>
            ${totalDist > 0 ? `<span class="total-badge">일일 합산: ${totalDist.toLocaleString()}m</span>` : ''}
          </div>
          ${sessionsHtml}
          ${log.feedback1 ? `
            <div class="ai-box">
              <div class="ai-title">🤖 AI 코칭 리포트</div>
              ${log.feedback1}
            </div>
          ` : ''}
          <div class="note-box clearfix">
            <label>📝 운동 일기 & 메모</label>
            <textarea class="note-textarea" id="note-${log.date}" placeholder="오늘 컨디션, 수모/수경 착용감 등을 기록해보세요.">${log.userNote || ""}</textarea>
            <button class="save-btn" data-date="${log.date}">저장하기</button>
          </div>
        `;

        logContainer.appendChild(card);
      });

      // 메모 저장 버튼 이벤트 리스너 등록
      document.querySelectorAll(".save-btn").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          const targetDate = e.target.getAttribute("data-date");
          const noteText = document.getElementById(`note-${targetDate}`).value;
          e.target.innerText = "저장 중...";
          try {
            const docRef = doc(db, "activities", targetDate);
            await updateDoc(docRef, { userNote: noteText });
            e.target.innerText = "완료!";
            setTimeout(() => { e.target.innerText = "저장하기"; }, 1500);
          } catch (err) {
            alert("저장 실패: " + err.message);
            e.target.innerText = "저장하기";
          }
        });
      });
    });
  </script>
</head>
<body>
  <header>
    <h1>Sports Log & AI Coach</h1>
  </header>
  <div id="loading">기록을 동기화하는 중입니다...</div>
  <div id="log-list"></div>
</body>
</html>
