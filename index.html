<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daily.Log - 가민 랩 데이터 & 1:1 AI 스포츠 코치</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #f1f5f9;
      --border-dark: #e2e8f0;
      --text: #1e293b;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      --swim-color: #0284c7;
      --swim-bg: #e0f2fe;
      --dive-color: #0d9488;
      --dive-bg: #ccfbf1;
      --golf-color: #16a34a;
      --golf-bg: #dcfce7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 16px; max-width: 720px; margin: 0 auto; line-height: 1.5; }

    /* 상단 헤더 */
    header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .header-left h1 { font-size: 1.45rem; font-weight: 800; color: #0f172a; letter-spacing: -0.02em; }
    .header-left p { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    
    .lock-btn {
      background: #ffffff;
      border: 1px solid var(--border-dark);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .lock-btn:hover { background: #f8fafc; border-color: #cbd5e1; }

    /* 필터 칩 탭 */
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px; }
    .filter-tab {
      background: #ffffff;
      border: 1px solid var(--border-dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .filter-tab.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    /* 캘린더 메인 카드 */
    .cal-container {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px 20px 28px 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(226, 232, 240, 0.7);
      user-select: none;
      touch-action: pan-y;
    }

    .cal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 0 4px;
    }
    .cal-top h2 { font-size: 1.15rem; font-weight: 700; color: #0f172a; }
    .cal-nav { display: flex; gap: 12px; }
    .cal-nav button {
      background: none;
      border: none;
      font-size: 1rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .cal-nav button:hover { color: #0f172a; background: #f1f5f9; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 14px;
      column-gap: 6px;
    }
    .cal-day-name {
      text-align: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .cal-cell {
      min-height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      border-radius: 12px;
      padding: 4px 2px;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
    }
    .cal-cell:hover { background: #f8fafc; }
    .cal-cell.empty { cursor: default; background: transparent !important; }
    .cal-cell-num {
      font-size: 0.85rem;
      font-weight: 500;
      color: #334155;
      margin-bottom: 4px;
    }
    .cal-cell.today .cal-cell-num {
      font-weight: 700;
      color: var(--accent);
    }

    /* 캘린더 내부 뱃지 */
    .cell-badges { display: flex; flex-direction: column; gap: 3px; width: 94%; }
    .cal-badge-pill {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 6px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .badge-swim { background: var(--swim-bg); color: var(--swim-color); }
    .badge-freediving { background: var(--dive-bg); color: var(--dive-color); }
    .badge-golf { background: var(--golf-bg); color: var(--golf-color); }
    .badge-other { background: #f1f5f9; color: #475569; }
    .badge-note-dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: #f59e0b;
      border-radius: 50%;
      margin-left: 2px;
      vertical-align: middle;
    }

    /* 모달 팝업 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 24px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 14px;
      margin-bottom: 16px;
    }
    .modal-header h2 { font-size: 1.15rem; font-weight: 800; color: #0f172a; }
    .close-btn { background: none; border: none; font-size: 1.4rem; color: var(--text-muted); cursor: pointer; }

    /* 세션 아이템 */
    .session-item {
      background: #f8fafc;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid #f1f5f9;
    }
    .session-title {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 12px;
      color: #0f172a;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .metric-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .metric-box strong { display: block; font-size: 0.88rem; color: #0f172a; margin-top: 3px; }

    /* 구간별 SWOLF 바 차트 */
    .chart-section {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 8px;
    }
    .chart-bars-wrap {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      height: 70px;
      padding-top: 6px;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 6px;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
    }
    .bar-pill {
      width: 100%;
      max-width: 28px;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      border-radius: 4px 4px 0 0;
      min-height: 6px;
      transition: height 0.3s ease;
    }
    .bar-value {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 2px;
    }
    .bar-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* 랩 텍스트 목록 */
    .laps-wrap { margin-top: 10px; border-top: 1px dashed #e2e8f0; padding-top: 8px; font-size: 0.75rem; color: var(--text-sub); }
    .lap-row { display: flex; justify-content: space-between; padding: 2px 0; }

    /* AI 리포트 */
    .ai-box {
      background: #eff6ff;
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
      font-size: 0.88rem;
      color: #1e3a8a;
      line-height: 1.6;
    }
    .ai-title { font-weight: 700; color: #2563eb; margin-bottom: 6px; font-size: 0.8rem; }

    /* 메모 */
    .note-box { margin-top: 18px; border-top: 1px solid #f1f5f9; padding-top: 16px; }
    .note-box label { display: block; font-size: 0.82rem; color: #b45309; font-weight: 700; margin-bottom: 6px; }
    .note-box textarea {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      color: #0f172a;
      padding: 12px;
      font-size: 0.85rem;
      resize: vertical;
      min-height: 70px;
    }
    .note-box textarea:focus { outline: none; border-color: var(--accent); background: #ffffff; }
    .save-btn {
      margin-top: 8px;
      background: #0f172a;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      float: right;
    }

    /* 핀 번호 잠금 화면 */
    .lock-overlay {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: #ffffff;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 24px;
      flex-direction: column;
    }
    .lock-box { text-align: center; max-width: 320px; width: 100%; }
    .lock-box h3 { font-size: 1.25rem; font-weight: 800; margin-bottom: 8px; }
    .lock-box p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
    .pin-input {
      width: 100%;
      text-align: center;
      letter-spacing: 12px;
      font-size: 1.8rem;
      padding: 10px;
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .unlock-btn {
      width: 100%;
      background: #0f172a;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 본인의 Firebase Console 정보로 교체해주세요
      const firebaseConfig = {
        apiKey: "AIzaSyAnU1E1qhqxIzcyNaO64H_PR9r_9CrnRxQ",
        authDomain: "garmin-sport-log.firebaseapp.com",
        projectId: "garmin-sport-log",
        storageBucket: "garmin-sport-log.firebasestorage.app",
        messagingSenderId: "836183510846",
        appId: "1:836183510846:web:b18cc66f12499f287ba66f"
      };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activityMap = {};
    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();
    let currentFilter = "all";
    let isLocked = false;
    const DEFAULT_PIN = "1234";

    const calGrid = document.getElementById("calendar-grid");
    const currentMonthLabel = document.getElementById("current-month-label");
    const modal = document.getElementById("detail-modal");
    const lockOverlay = document.getElementById("lock-overlay");

    // Firestore 실시간 데이터 로드
    onSnapshot(collection(db, "activities"), (snapshot) => {
      activityMap = {};
      snapshot.forEach(docSnap => {
        activityMap[docSnap.id] = docSnap.data();
      });
      renderCalendar();
    });

    function renderCalendar() {
      calGrid.innerHTML = "";
      currentMonthLabel.innerText = `${currentYear}년 ${currentMonth + 1}월`;

      const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
      const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();

      const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
      dayNames.forEach(d => {
        const div = document.createElement("div");
        div.className = "cal-day-name";
        div.innerText = d;
        calGrid.appendChild(div);
      });

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "cal-cell empty";
        calGrid.appendChild(emptyCell);
      }

      for (let d = 1; d <= lastDate; d++) {
        const cell = document.createElement("div");
        cell.className = "cal-cell";

        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isToday = (today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === d);
        if (isToday) cell.classList.add("today");

        const log = activityMap[dateStr];
        let badgesHtml = "";

        if (log && log.sessions && log.sessions.length > 0) {
          const filtered = log.sessions.filter(s => {
            if (currentFilter === "all") return true;
            return s.sport === currentFilter;
          });

          if (filtered.length > 0) {
            badgesHtml = '<div class="cell-badges">';
            filtered.forEach(s => {
              let label = "";
              let bClass = "badge-other";

              // 종목별 이모지 및 핵심 수치 반영
              if (s.sport === "swim") {
                bClass = "badge-swim";
                label = `🏊 ${s.distance ? s.distance.toLocaleString() + 'm' : '수영'}`;
              } else if (s.sport === "freediving") {
                bClass = "badge-freediving";
                label = `🤿 ${s.maxDepth ? s.maxDepth + 'm' : '다이빙'}`;
              } else if (s.sport === "golf") {
                bClass = "badge-golf";
                label = `⛳ ${s.score ? s.score + '타' : '골프'}`;
              } else {
                label = `🏅 ${s.title || "운동"}`;
              }

              const noteDot = log.userNote ? '<span class="badge-note-dot"></span>' : '';
              badgesHtml += `<span class="cal-badge-pill ${bClass}">${label}${noteDot}</span>`;
            });
            badgesHtml += '</div>';
          }
        }

        cell.innerHTML = `
          <div class="cal-cell-num">${d}</div>
          ${badgesHtml}
        `;

        cell.addEventListener("click", () => openDetailModal(dateStr));
        calGrid.appendChild(cell);
      }
    }

    function openDetailModal(dateStr) {
      if (isLocked) return;
      const log = activityMap[dateStr] || { date: dateStr, sessions: [], userNote: "", feedback1: "" };
      document.getElementById("modal-date").innerText = `${dateStr} 기록`;

      const container = document.getElementById("modal-sessions");
      container.innerHTML = "";

      if (!log.sessions || log.sessions.length === 0) {
        container.innerHTML = '<div style="color:#94a3b8; text-align:center; padding:24px;">기록된 운동이 없습니다.</div>';
      } else {
        log.sessions.forEach(s => {
          const sBox = document.createElement("div");
          sBox.className = "session-item";

          let metrics = "";
          let lapsHtml = "";
          let chartHtml = "";

          if (s.sport === "swim") {
            metrics += `<div class="metric-box">거리<strong>${s.distance ? s.distance.toLocaleString() + 'm' : '-'}</strong></div>`;
            metrics += `<div class="metric-box">페이스<strong>${s.pace || '-'}</strong></div>`;
            metrics += `<div class="metric-box">SWOLF<strong>${s.swolf || '-'}</strong></div>`;
            if (s.avgStrokes) metrics += `<div class="metric-box">스트로크<strong>${s.avgStrokes}회</strong></div>`;
            if (s.poolLength) metrics += `<div class="metric-box">레인<strong>${s.poolLength}m</strong></div>`;
            if (s.avgHR) metrics += `<div class="metric-box">심박<strong>${s.avgHR} / ${s.maxHR || '-'}</strong></div>`;
            if (s.aerobicTE) metrics += `<div class="metric-box">운동효과<strong>유 ${s.aerobicTE} / 무 ${s.anaerobicTE || 0}</strong></div>`;
            if (s.trainingLoad) metrics += `<div class="metric-box">부하<strong>${s.trainingLoad}</strong></div>`;
            if (s.calories) metrics += `<div class="metric-box">칼로리<strong>${s.calories} kcal</strong></div>`;

            if (s.laps && s.laps.length > 0) {
              const swolfValues = s.laps.map(l => typeof l.swolf === 'number' ? l.swolf : parseInt(l.swolf) || 0).filter(v => v > 0);
              const maxVal = Math.max(...swolfValues, 45);

              let bars = "";
              s.laps.forEach(l => {
                const val = typeof l.swolf === 'number' ? l.swolf : parseInt(l.swolf) || 0;
                const hPercent = val > 0 ? Math.min(100, Math.round((val / maxVal) * 100)) : 15;
                bars += `
                  <div class="bar-col">
                    <span class="bar-value">${val || '-'}</span>
                    <div class="bar-pill" style="height: ${hPercent}%;"></div>
                    <span class="bar-label">${l.lap}</span>
                  </div>
                `;
              });

              chartHtml = `
                <div class="chart-section">
                  <div class="chart-header">
                    <span>📊 구간별 SWOLF 추이 (낮을수록 효율적)</span>
                    <span style="color:#0284c7;">평균 ${s.swolf || '-'}</span>
                  </div>
                  <div class="chart-bars-wrap">${bars}</div>
                </div>
              `;

              lapsHtml = '<div class="laps-wrap">' + s.laps.map(l => 
                `<div class="lap-row"><span>${l.lap}</span><span>${l.pace} (SWOLF ${l.swolf})</span></div>`
              ).join("") + '</div>';
            }
          } else if (s.sport === "freediving") {
            metrics += `<div class="metric-box">최대 수심<strong>${s.maxDepth || 0}m</strong></div>`;
            metrics += `<div class="metric-box">시간<strong>${Math.floor((s.duration || 0)/60)}분</strong></div>`;
            if (s.avgHR) metrics += `<div class="metric-box">심박<strong>${s.avgHR} bpm</strong></div>`;
          } else if (s.sport === "golf") {
            metrics += `<div class="metric-box">스코어<strong>${s.score || '-'}</strong></div>`;
            metrics += `<div class="metric-box">시간<strong>${Math.floor((s.duration || 0)/60)}분</strong></div>`;
            if (s.calories) metrics += `<div class="metric-box">칼로리<strong>${s.calories} kcal</strong></div>`;
          } else {
            metrics += `<div class="metric-box">시간<strong>${Math.floor((s.duration || 0)/60)}분</strong></div>`;
            if (s.avgHR) metrics += `<div class="metric-box">심박<strong>${s.avgHR} bpm</strong></div>`;
          }

          sBox.innerHTML = `
            <div class="session-title">
              <span>${s.icon || '🏅'} ${s.title || '운동 세션'}</span>
              <span style="font-size:0.75rem; color:#94a3b8;">${s.location || ''}</span>
            </div>
            <div class="metrics-grid">${metrics}</div>
            ${chartHtml}
            ${lapsHtml}
          `;
          container.appendChild(sBox);
        });
      }

      const aiBox = document.getElementById("modal-ai");
      if (log.feedback1) {
        aiBox.style.display = "block";
        document.getElementById("modal-ai-text").innerText = log.feedback1;
      } else {
        aiBox.style.display = "none";
      }

      const noteText = document.getElementById("modal-note");
      noteText.value = log.userNote || "";

      const saveBtn = document.getElementById("modal-save-btn");
      saveBtn.onclick = async () => {
        saveBtn.innerText = "저장 중...";
        try {
          const docRef = doc(db, "activities", dateStr);
          await updateDoc(docRef, { userNote: noteText.value });
          saveBtn.innerText = "저장 완료!";
          setTimeout(() => { saveBtn.innerText = "메모 저장"; }, 1500);
        } catch (err) {
          alert("저장 실패: " + err.message);
          saveBtn.innerText = "메모 저장";
        }
      };

      modal.style.display = "flex";
    }

    document.getElementById("modal-close-btn").onclick = () => modal.style.display = "none";
    modal.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

    document.querySelectorAll(".filter-tab").forEach(tab => {
      tab.addEventListener("click", (e) => {
        document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentFilter = tab.getAttribute("data-filter");
        renderCalendar();
      });
    });

    function prevMonth() {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar();
    }
    function nextMonth() {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    }

    document.getElementById("prev-btn").onclick = prevMonth;
    document.getElementById("next-btn").onclick = nextMonth;

    const calArea = document.getElementById("cal-container");
    let touchStartX = 0;
    let touchEndX = 0;

    calArea.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    calArea.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) prevMonth();
        else nextMonth();
      }
    }, { passive: true });

    const lockBtn = document.getElementById("lock-btn");
    lockBtn.onclick = () => {
      isLocked = true;
      lockOverlay.style.display = "flex";
      document.getElementById("pin-input").value = "";
    };

    document.getElementById("unlock-btn").onclick = () => {
      const entered = document.getElementById("pin-input").value;
      if (entered === DEFAULT_PIN) {
        isLocked = false;
        lockOverlay.style.display = "none";
      } else {
        alert("비밀번호가 일치하지 않습니다.");
      }
    };
  </script>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>Daily.Log</h1>
      <p>가민 랩 데이터 & 1:1 AI 스포츠 코치</p>
    </div>
    <button class="lock-btn" id="lock-btn">🔒 잠그기</button>
  </header>

  <div class="filter-tabs">
    <button class="filter-tab active" data-filter="all">✨ 전체</button>
    <button class="filter-tab" data-filter="swim">🏊 수영</button>
    <button class="filter-tab" data-filter="freediving">🤿 프리다이빙</button>
    <button class="filter-tab" data-filter="golf">⛳ 골프</button>
  </div>

  <div class="cal-container" id="cal-container">
    <div class="cal-top">
      <h2 id="current-month-label"></h2>
      <div class="cal-nav">
        <button id="prev-btn">&lt;</button>
        <button id="next-btn">&gt;</button>
      </div>
    </div>
    <div class="cal-grid" id="calendar-grid"></div>
  </div>

  <div class="modal-overlay" id="detail-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-date"></h2>
        <button class="close-btn" id="modal-close-btn">&times;</button>
      </div>
      <div id="modal-sessions"></div>
      <div class="ai-box" id="modal-ai" style="display:none;">
        <div class="ai-title">🤖 AI 코칭 리포트</div>
        <div id="modal-ai-text"></div>
      </div>
      <div class="note-box" style="overflow:hidden;">
        <label>📝 운동 일기 & 메모</label>
        <textarea id="modal-note" placeholder="오늘 운동 감각, 컨디션 등을 남겨보세요."></textarea>
        <button class="save-btn" id="modal-save-btn">메모 저장</button>
      </div>
    </div>
  </div>

  <div class="lock-overlay" id="lock-overlay">
    <div class="lock-box">
      <h3>🔒 Daily.Log 잠김</h3>
      <p>운동 일지를 보려면 PIN 4자리를 입력하세요.</p>
      <input type="password" class="pin-input" id="pin-input" maxlength="4" placeholder="••••" />
      <button class="unlock-btn" id="unlock-btn">잠금 해제</button>
    </div>
  </div>

</body>
</html>
