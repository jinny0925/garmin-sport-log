<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garmin Sport Log & AI Coach</title>

  <!-- 모바일 전체 화면 앱(PWA) 설정 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#2563eb" />

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --sub: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --accent: #0284c7;
      --ai-green: #15803d;
      --ai-green-bg: #f0fdf4;
      --ai-purple: #6d28d9;
      --ai-purple-bg: #faf5ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; }
    .container { max-width: 500px; margin: 0 auto; }

    header { margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 20px; font-weight: 800; }
    .logo span { color: var(--primary); }
    .badge { font-size: 11px; background: #e0e7ff; color: var(--primary); padding: 4px 8px; border-radius: 12px; font-weight: 700; }

    .filter-bar { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; }
    .filter-btn { border: 1px solid var(--border); background: var(--card); padding: 7px 12px; border-radius: 18px; font-size: 12px; font-weight: 600; color: var(--sub); cursor: pointer; white-space: nowrap; }
    .filter-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

    .calendar-card { background: var(--card); border-radius: 16px; padding: 16px; border: 1px solid var(--border); box-shadow: 0 4px 14px rgba(0,0,0,0.03); }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 700; font-size: 15px; }
    .month-nav button { border: none; background: none; font-size: 16px; cursor: pointer; padding: 4px 8px; color: var(--sub); }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .day-label { font-size: 11px; font-weight: 600; color: var(--sub); padding-bottom: 6px; }

    /* 원래 예뻤던 날짜 셀 높이 및 여백 복구 */
    .cell { 
      height: 60px; 
      border-radius: 8px; 
      padding: 4px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      align-items: center; 
      background: #fff; 
      cursor: pointer; 
    }
    .cell:hover, .cell:active { background: #f1f5f9; }
    .cell.empty { background: none; cursor: default; }
    .date-num { font-size: 11px; color: var(--sub); }
    .icons-wrap { display: flex; gap: 2px; font-size: 13px; }

    /* 상세 모달 */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: flex-end; z-index: 100; }
    .modal-backdrop.open { display: flex; }
    .modal-content { background: #fff; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 88vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .modal-close { border: none; background: none; font-size: 24px; color: var(--sub); cursor: pointer; }

    /* 메트릭 박스 */
    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
    .metric-box { background: #f8fafc; padding: 10px 4px; border-radius: 10px; text-align: center; border: 1px solid var(--border); }
    .metric-title { font-size: 10px; color: var(--sub); margin-bottom: 2px; }
    .metric-val { font-size: 13px; font-weight: 700; color: var(--text); }

    /* 구간별 랩 차트 */
    .section-title { font-size: 12px; font-weight: 700; color: var(--sub); margin: 12px 0 6px; display: flex; justify-content: space-between; }
    .lap-chart { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
    .lap-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 11px; }
    .lap-row:last-child { margin-bottom: 0; }
    .lap-name { width: 42px; font-weight: 600; color: var(--sub); }
    .bar-bg { flex: 1; height: 16px; background: #e2e8f0; border-radius: 8px; overflow: hidden; display: flex; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 8px; }
    .lap-val { width: 75px; text-align: right; font-weight: 600; font-size: 11px; }

    /* AI 분석 1: 가민 세션 분석 */
    .ai-card-1 { background: var(--ai-green-bg); border: 1px solid #bbf7d0; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .ai-title-1 { font-size: 12px; font-weight: 700; color: var(--ai-green); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
    .ai-text-1 { font-size: 12px; color: #14532d; line-height: 1.5; white-space: pre-line; }

    /* 수영 일기 작성 */
    .journal-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
    .journal-input { width: 100%; height: 60px; border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 12px; resize: none; margin-top: 6px; outline: none; }
    .journal-btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 600; margin-top: 6px; cursor: pointer; }

    /* AI 분석 2: 맞춤 피드백 */
    .ai-card-2 { background: var(--ai-purple-bg); border: 1px solid #e9d5ff; border-radius: 12px; padding: 14px; }
    .ai-title-2 { font-size: 12px; font-weight: 700; color: var(--ai-purple); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
    .ai-text-2 { font-size: 12px; color: #4c1d95; line-height: 1.5; white-space: pre-line; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <div class="logo">Daily<span>.</span>Log</div>
      <div style="font-size:12px;color:var(--sub)">가민 랩 데이터 & 1:1 AI 수영 코치</div>
    </div>
    <div class="badge">Dual AI Coach</div>
  </header>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterLogs('all',this)">✨ 전체</button>
    <button class="filter-btn" onclick="filterLogs('swim',this)">🏊 수영</button>
    <button class="filter-btn" onclick="filterLogs('freediving',this)">🤿 프리다이빙</button>
    <button class="filter-btn" onclick="filterLogs('golf',this)">⛳ 골프</button>
  </div>

  <div class="calendar-card">
    <div class="calendar-header">
      <span id="calendarTitle"></span>
      <div class="month-nav">
        <button onclick="prevMonth()">&lt;</button>
        <button onclick="nextMonth()">&gt;</button>
      </div>
    </div>
    <div class="grid" id="dayLabels"></div>
    <div class="grid" id="calendarGrid"></div>
  </div>
</div>

<!-- 상세 피드백 모달 -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div>
        <h3 id="modalTitle" style="font-size:16px;font-weight:700"></h3>
        <span id="modalDate" style="font-size:11px;color:var(--sub)"></span>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">&times;</button>
    </div>

    <!-- 1. 기본 메트릭 요약 -->
    <div class="metrics-grid" id="metricsContainer"></div>

    <!-- 2. 구간별 랩 차트 -->
    <div id="lapSection" style="display:none;">
      <div class="section-title">
        <span>구간별 페이스 & SWOLF 분석</span>
        <span style="font-size:10px;font-weight:normal">페이스 / SWOLF</span>
      </div>
      <div class="lap-chart" id="lapChartContainer"></div>
    </div>

    <!-- 3. AI 분석 1: 가민 데이터 심층 리포트 -->
    <div class="ai-card-1">
      <div class="ai-title-1">📊 AI 분석 1: 가민 데이터 심층 리포트</div>
      <div class="ai-text-1" id="feedbackText1"></div>
    </div>

    <!-- 4. 사용자 일기 & 질문 작성 -->
    <div class="journal-box">
      <div style="font-size:11px;font-weight:700;color:var(--text)">✍️ 오늘 운동 일기 / 코치에게 질문</div>
      <textarea class="journal-input" id="journalInput" placeholder="오늘 수영할 때 느낌이나 궁금한 점을 적어보세요."></textarea>
      <button class="journal-btn" onclick="askAiCoach()">질문 및 피드백 받기</button>
    </div>

    <!-- 5. AI 분석 2: 질문/일기 맞춤 피드백 -->
    <div class="ai-card-2" id="qnaBox">
      <div class="ai-title-2">💡 AI 분석 2: 1:1 맞춤 일기 코칭 처방</div>
      <div class="ai-text-2" id="feedbackText2">아직 작성된 일기나 질문이 없습니다.</div>
    </div>
  </div>
</div>

<script>
  let activityLogs = [];
  let currentDate = new Date();
  let currentFilter = 'all';
  let currentLog = null;
  const dayNames = ['일','월','화','수','목','금','토'];

  function initCalendar() {
    document.getElementById('dayLabels').innerHTML = dayNames.map(d => `<div class="day-label">${d}</div>`).join('');
    fetch('activities.json')
      .then(res => res.json())
      .then(data => { if(data && data.length) activityLogs = data; renderCalendar(); })
      .catch(() => { renderCalendar(); });
  }

  function renderCalendar() {
    const y = currentDate.getFullYear(), m = currentDate.getMonth();
    document.getElementById('calendarTitle').innerText = `${y}년 ${m + 1}월`;
    const f = new Date(y, m, 1).getDay(), l = new Date(y, m + 1, 0).getDate();
    const g = document.getElementById('calendarGrid');
    g.innerHTML = '';
    for (let i = 0; i < f; i++) g.innerHTML += '<div class="cell empty"></div>';
    for (let d = 1; d <= l; d++) {
      const dStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const logs = activityLogs.filter(item => item.date === dStr && (currentFilter === 'all' || item.type === currentFilter));
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = `<span class="date-num">${d}</span><div class="icons-wrap">${logs.map(x => x.icon).join('')}</div>`;
      if (logs.length > 0) cell.onclick = () => openModal(logs[0]);
      g.appendChild(cell);
    }
  }

  function filterLogs(t, b) {
    currentFilter = t;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    b.classList.add('active');
    renderCalendar();
  }

  function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
  function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }

  function openModal(log) {
    currentLog = log;
    document.getElementById('modalTitle').innerText = `${log.icon} ${log.title}`;
    document.getElementById('modalDate').innerText = `${log.date} ${log.location ? '· ' + log.location : ''}`;
    
    // 지표
    document.getElementById('metricsContainer').innerHTML = log.metrics.map(m => `
      <div class="metric-box">
        <div class="metric-title">${m.label}</div>
        <div class="metric-val">${m.value}</div>
      </div>
    `).join('');

    // 랩 차트
    const lapSec = document.getElementById('lapSection');
    if (log.laps && log.laps.length > 0) {
      lapSec.style.display = 'block';
      document.getElementById('lapChartContainer').innerHTML = log.laps.map(l => `
        <div class="lap-row">
          <div class="lap-name">${l.lap}</div>
          <div class="bar-bg"><div class="bar-fill" style="width:${l.pct}%"></div></div>
          <div class="lap-val">${l.pace} / S:${l.swolf}</div>
        </div>
      `).join('');
    } else {
      lapSec.style.display = 'none';
    }

    // AI 리포트 1
    document.getElementById('feedbackText1').innerText = log.feedback1 || log.feedback || "데이터 분석 중입니다.";
    
    // 일기 & AI 리포트 2
    document.getElementById('journalInput').value = log.userNote || "";
    document.getElementById('feedbackText2').innerText = log.feedback2 || "작성하신 질문이나 일기가 없습니다. 위 칸에 적고 피드백을 받아보세요!";
    
    document.getElementById('modalBackdrop').classList.add('open');
  }

  function askAiCoach() {
    const text = document.getElementById('journalInput').value.trim();
    if (!text) return alert("일기나 궁금한 점을 입력해주세요!");
    
    const ansBox = document.getElementById('feedbackText2');
    ansBox.innerText = "코치가 일기를 분석하여 답변을 작성하고 있습니다... ⏳";
    
    setTimeout(() => {
      ansBox.innerText = `[1:1 코칭 피드백]\n"${text}"에 대해:\n적어주신 느낌과 당일 랩 기록을 함께 살펴보았을 때, 숨 쉴 때 고개를 과하게 들지 않고 한쪽 볼을 수면에 붙인 채 회전하는 롤링에 집중하면 한결 편안해지실 거예요!`;
      if(currentLog) {
        currentLog.userNote = text;
        currentLog.feedback2 = ansBox.innerText;
      }
    }, 800);
  }

  function closeModal(e) { if (e.target.id === 'modalBackdrop') closeModalDirect(); }
  function closeModalDirect() { document.getElementById('modalBackdrop').classList.remove('open'); }

  initCalendar();
</script>
</body>
</html>
